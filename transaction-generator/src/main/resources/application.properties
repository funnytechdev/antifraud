spring.application.name=transaction-generator
spring.main.web-application-type=none

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all

# --- Stream ---
# The seed fixes the simulated world, so the blacklist is the same on every run.
generator.seed=42
generator.rate-per-second=20
generator.tick=100ms
# Share of purchases that start a fraud scenario; a scenario may consist of many purchases.
generator.fraud-probability=0.002

# --- World ---
generator.world.customers=5000
generator.world.merchants=300
generator.world.compromised-cards=50
generator.world.fraud-merchants=10

# --- Topics ---
generator.topics.transactions=transactions
generator.topics.labels=transaction-labels
generator.topics.partitions=6

# --- Blacklist feed to the antifraud service ---
generator.blacklist-feed.enabled=true
generator.blacklist-feed.base-url=${ANTIFRAUD_URL:http://localhost:8080}
generator.blacklist-feed.max-attempts=30
generator.blacklist-feed.retry-delay=2s
