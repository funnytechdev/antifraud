spring.application.name=antifraud-service
server.port=8080
# Errors are returned as RFC 9457 problem details, with the reason in "detail".
spring.mvc.problemdetails.enabled=true

# --- PostgreSQL: decisions and their history ---
# The container is published on 5433 so it does not clash with a locally installed PostgreSQL.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:antifraud}
spring.datasource.username=${POSTGRES_USER:antifraud}
spring.datasource.password=${POSTGRES_PASSWORD:antifraud}

# --- Redis: per-card state and blacklists ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis answers in well under a millisecond; a command that takes longer than this is treated as failed.
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=antifraud-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# A malformed message must not stop the partition: the wrapper turns a deserialization failure
# into an error the listener container can skip.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.antifraud.contracts.TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# One consumer thread per partition group; events of one card always stay on one thread.
spring.kafka.listener.concurrency=3

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Topics ---
antifraud.topics.transactions=transactions
antifraud.topics.decisions=decisions
antifraud.topics.partitions=6

# --- Settings ---
# Rule scores, parameters and verdict thresholds are stored in PostgreSQL and managed through
# /api/v1/rules and /api/v1/scoring. Changes made through another instance arrive within this interval.
antifraud.settings.refresh-interval=5s

# --- Rule state in Redis ---
# Kept longer than any window: after a downtime the consumer replays old events, and by event time
# their neighbours are still inside the window.
antifraud.state.velocity-ttl=1h
# A card unused for longer is treated as a fresh one by the impossible travel rule.
antifraud.state.location-ttl=30d
# Purchase habits of a customer who has been inactive for longer are forgotten.
antifraud.state.amount-stats-ttl=180d

# --- Redis outage ---
# Every Redis call on the scoring path goes through this circuit breaker. It opens when half of the
# last 20 calls failed (at least 10 calls), lets 3 trial calls through after 5 seconds and closes
# again if they succeed.
resilience4j.circuitbreaker.instances.redis.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.redis.sliding-window-size=20
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redis.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.redis.register-health-indicator=true
# An open breaker is shown in /actuator/health but does not make the service DOWN: it keeps deciding.
resilience4j.circuitbreaker.instances.redis.allow-health-indicator-to-fail=false
management.health.circuitbreakers.enabled=true

# While Redis is unavailable, the rules that need it are skipped. Purchases from this amount on get
# at least the fallback verdict; smaller ones are decided by the remaining rules.
# ALLOW = fail-open, REVIEW = ask the customer to confirm, BLOCK = fail-closed. See README.
antifraud.degradation.fallback-verdict=REVIEW
antifraud.degradation.review-min-amount=5000
