spring.application.name=antifraud-service
server.port=8080

# --- PostgreSQL: decisions and their history ---
# The container is published on 5433 so it does not clash with a locally installed PostgreSQL.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:antifraud}
spring.datasource.username=${POSTGRES_USER:antifraud}
spring.datasource.password=${POSTGRES_PASSWORD:antifraud}

# --- Redis: per-card state and blacklists ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=500ms

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Scoring: the scores of all triggered rules are summed up ---
antifraud.scoring.review-threshold=40
antifraud.scoring.block-threshold=80

# --- Rules ---
# 10 purchases on one card within 2 minutes of event time.
antifraud.rules.velocity.score=50
antifraud.rules.velocity.threshold=10
antifraud.rules.velocity.window=2m
# The window is kept longer than its length: after a downtime the consumer replays old events,
# and by event time their neighbours are still inside the window.
antifraud.rules.velocity.state-ttl=1h
antifraud.rules.blacklisted-card.score=100
antifraud.rules.blacklisted-merchant.score=60
